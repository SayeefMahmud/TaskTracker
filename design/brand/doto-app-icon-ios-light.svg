<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="DoTo">
  <title>DoTo — iOS app icon, light tile (iOS renders transparent icons black, so a tile is required)</title>
  <defs>
    <linearGradient id="doto-ios-tile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E4EDF5"/>
    </linearGradient>
    <linearGradient id="doto-ios-front" x1="14" y1="98" x2="90" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00A9DC"/>
      <stop offset="1" stop-color="#004081"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#doto-ios-tile)"/>
  <g transform="translate(512 512) scale(6.674) translate(-60 -52)">
    <rect x="30" y="6" width="76" height="76" rx="24" fill="#004081" opacity="0.14"/>
    <rect x="22" y="14" width="76" height="76" rx="24" fill="#004081" opacity="0.30"/>
    <rect x="14" y="22" width="76" height="76" rx="24" fill="url(#doto-ios-front)"/>
    <path d="M36 61 L49 74 L74 46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
